name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: upstream drift (paseo-main) and new Paseo releases (verified-paseo)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # No Paseo CLI or app on the runner: daemon and app tests skip, `ppd check` runs as a labeled APPROXIMATION.
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        run: |
          node dist/cli.js --version
          node dist/cli.js --help | grep -q "never port 6767"
          node dist/cli.js check examples/hello-plugin
          node dist/cli.js registry precheck examples/hello-plugin
          # The real daemon's port is refused with the safety exit code before anything starts.
          set +e
          node dist/cli.js daemon up --port 6767
          code=$?
          set -e
          test "$code" = "3"
      - name: Package contents
        run: node .github/scripts/check-package.mjs

  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json
      - run: npm ci
      - working-directory: docs-site
        run: npm ci
      - name: Commands reference matches `ppd --help`
        working-directory: docs-site
        run: |
          npm run gen:commands
          git diff --exit-code -- src/lib/commands.json
      - name: Recipes pass ppd check
        working-directory: docs-site
        run: npm run check:recipes
      - working-directory: docs-site
        run: npm run build

  paseo-main:
    name: tests against Paseo main
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PASEO_SOURCE: ${{ github.workspace }}/paseo
    steps:
      - uses: actions/checkout@v7
        with:
          path: devkit
      - uses: actions/checkout@v7
        with:
          repository: getpaseo/paseo
          ref: main
          path: paseo
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            devkit/package-lock.json
            paseo/package-lock.json
      - working-directory: paseo
        run: npm ci && npm run build:client && npm run build:plugin
      - working-directory: devkit
        run: npm ci && npm test

  verified-paseo:
    name: verified on the latest Paseo release
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo getpaseo/paseo --json tagName --jq '.tagName | ltrimstr("v")')
          verified=$(sed -n 's/^export const VERIFIED_PASEO = "\(.*\)";$/\1/p' src/compat.ts)
          if [ "$latest" != "$verified" ]; then
            echo "::error::Paseo $latest is out and ppd is verified on ${verified:-?}: run PPD_E2E=1 npm test and ppd web with Paseo $latest on a Mac, then bump VERIFIED_PASEO in src/compat.ts"
            exit 1
          fi
